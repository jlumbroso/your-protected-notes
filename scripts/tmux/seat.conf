# Tmux seat configuration — invisibility config for VS Code integrated terminal
#
# Ported from caring-feedback (ADR-0050 lineage; Steward 4.5, Commodore 5, Jérémie
# — see scripts/last-message.py's wake-infrastructure header comment for full
# attribution). See the maintainers' meta-repo ADR-0004/0005 (adoption) and
# ADR-0006 (this template port).
#
# Goal: Inside a plain VS Code terminal, a launched seat should be visually and
# behaviorally indistinguishable from bare `claude` at first approximation —
# with one deliberate exception (below).
#
# Usage: `tmux source-file scripts/tmux/seat.conf` against a running server,
# then `tmux new-session -s <project>-<alias>-seat claude --resume <uuid>
# --model <model>` — NOT `new-session -f <this-file>`: new-session's own -f
# flag means "client flags" (tmux(1), see attach-session), not "config file";
# a filesystem path there is silently accepted as garbage and never read.
# This was the existing-session title-rewrite bug (ADR-0004 Iteration 6) —
# _tmux_apply_seat_conf in last-message.py is what actually applies this file
# now, unconditionally, on every launch/attach/update-titles.
#
# This config is loaded via `source-file`, so it never touches ~/.tmux.conf.

# Status bar: ON, with a per-seat color (set by the launcher from
# agent-sessions.json's optional settings.color_hex, decoupled from the
# CLI /color palette). Philosophy shift from the original "no green bar"
# spec, per the improvements-batch discovery: tmux supports arbitrary hex
# colors, which Claude Code's own ~8-color /color palette does not — so the
# status bar goes from a thing to hide into the seat's visual identifier.
# Default gray below is overridden per-session if a seat has a color_hex set.
set -g status on
set -g status-style "bg=#666666,fg=white"

# Status bar content: custom format so Claude Code's own pane-title
# animation emoji (added during turns) never reaches the display. The
# launcher overrides both sides per-session with literal, pre-composed text
# (see cmd_launch/_tmux_set_status_left/_tmux_set_status_right) — the
# fallbacks below only matter for a plain, non-seat tmux session that never
# gets those per-session overrides applied. Deliberately literal injection
# from Python rather than tmux's own #{...} format-string substitution for
# the same reason status-right already was: the launcher already knows every
# value (project, alias, display name) before it ever invokes tmux, so it can
# hand over the final composed string directly instead of asking tmux's own,
# more limited variable language to reconstruct it from session/pane state.
set -g status-left-length 50
set -g status-left "[#S] "
set -g status-right-length 50
set -g status-right "#{?@seat_display_name,#{@seat_display_name},#{pane_title}} | %H:%M %d-%b-%y"

# Terminal title: on (set by launcher with seat display name)
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Mouse: on (wheel scroll → copy-mode scrollback that feels native)
set -g mouse on

# History: large scrollback buffer
set -g history-limit 50000

# Truecolor + italics support (for Claude Code's UI). NOT screen-256color:
# its terminfo entry defines no sitm/ritm (start/end-italics) capability at
# all, so italic SGR escapes fall back to whatever the outer terminal guesses
# — observed live as bold-looking, foreground/background-inverted text
# (2026-07-07, once this file started actually loading for the first time —
# see the source-file note above). tmux-256color defines sitm/ritm properly
# and is the modern recommended value for exactly this "tmux wrapping a
# truecolor-aware program" case.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Detached default size (headless new-session fails under systemd without explicit size)
set -g default-size 80x24

# Prefix key: LEFT ALONE (default Ctrl-B)
# NOTE: If Claude Code TUI needs Ctrl-B passthrough, rebind prefix here to
# something obscure (e.g., Ctrl-\). Verify first that Ctrl-B isn't needed by
# the TUI before changing this. For now: keeping default, assuming no conflict.

# Window/pane settings: quiet, minimal
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Escape time: reduce delay for key sequences (helps with responsiveness)
set -sg escape-time 10

# Base index: start windows and panes at 1 (not 0) for easier keyboard nav
set -g base-index 1
setw -g pane-base-index 1

# Automatic window renaming: off (prevents tmux from overwriting custom names)
setw -g automatic-rename off
set -g allow-rename off
